<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Swahivo OG</title>
  <style>
    @font-face {
      font-family: "CardSerif";
      src: url("fonts/cormorant-700.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "CardSans";
      src: url("fonts/outfit-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0B0D12;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    .photo {
      position: absolute;
      inset: 0;
      background:
        url("refs/villa1.jpg") center 38% / cover no-repeat;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 72% 52% at 50% 46%,
          rgba(11, 13, 18, 0.58) 0%,
          rgba(11, 13, 18, 0.28) 58%,
          rgba(11, 13, 18, 0.18) 100%),
        linear-gradient(180deg,
          rgba(11, 13, 18, 0.38) 0%,
          rgba(11, 13, 18, 0.12) 36%,
          rgba(11, 13, 18, 0.20) 62%,
          rgba(11, 13, 18, 0.55) 100%);
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: 62%;
      text-align: center;
      color: #FFFFFF;
    }
    .brand {
      font-family: "CardSerif", "Liberation Serif", Georgia, serif;
      font-weight: 700;
      font-size: 118px;
      line-height: 0.95;
      letter-spacing: 0.12em;
      color: #FFFFFF;
      text-shadow: 0 2px 28px rgba(0, 0, 0, 0.45);
      padding-left: 0.12em; /* optical center with tracking */
    }
    .rule {
      width: 72px;
      height: 3px;
      margin: 22px auto 18px;
      background: #E53935;
      border-radius: 2px;
    }
    .tag {
      font-family: "CardSans", "Liberation Sans", system-ui, sans-serif;
      font-weight: 400;
      font-size: 24px;
      line-height: 1.3;
      letter-spacing: 0.14em;
      color: #FFFFFF;
      text-shadow: 0 1px 16px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="photo"></div>
    <div class="scrim"></div>
    <div class="lockup">
      <div class="brand">Swahivo</div>
      <div class="rule"></div>
      <div class="tag">Find your dream home in Tanzania</div>
    </div>
  </div>
  <script>
    const bg = new Image();
    const fonts = document.fonts ? document.fonts.ready : Promise.resolve();
    const photo = new Promise((resolve) => {
      bg.onload = resolve;
      bg.onerror = resolve;
      bg.src = "refs/villa1.jpg";
    });
    Promise.all([fonts, photo]).then(() => {
      document.documentElement.setAttribute("data-ready", "1");
    });
  </script>
</body>
</html>
